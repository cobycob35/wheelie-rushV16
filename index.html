<script>
const c=document.querySelector('#c'),g=c.getContext('2d');let W,H;function size(){W=c.width=innerWidth;H=c.height=innerHeight}size();addEventListener('resize',size);

];for(let i=1;i<=10;i++)rides.push({n:`Volt E-Bike ${i}`,t:'E-BIKE',max:65+i,c:`hsl(${185+i*10} 80% 48%)`});for(let i=1;i<=10;i++)rides.push({n:`MX 450 Dirt Bike ${i}`,t:'DIRT BIKE',max:92+i*2,c:`hsl(${i*29} 85% 50%)`});for(let i=1;i<=10;i++)rides.push({n:`Turbo Sport Quad ${i}`,t:'TUNED QUAD',max:100+i*2,c:`hsl(${290+i*9} 85% 52%)`});
let idx=10,speed=0,angle=0,dist=0,gear=0,rpm=1000,temp=65,started=false,choke=false,gas=false,brake=false,wheel=false,trick=false,audio,turbo=0,last=performance.now(),pulse=0,scroll=0,suspF=0,suspR=0,suspFV=0,suspRV=0,audioRate=.86,lastRateUpdate=0,shiftCutUntil=0,stiffness=50,damping=50,chassisPitch=0;
const R=()=>rides[idx],S=document.querySelector('#ride');const idleAudio=document.querySelector('#idleAudio'),quadAudio=document.querySelector('#quadAudio'),turboAudio=document.querySelector('#turboAudio');idleAudio.volume=.68;

function AC(){if(!audio)audio=new (AudioContext||webkitAudioContext)();if(audio.state==='suspended')audio.resume()}

function road(){let y=H*.58;g.fillStyle='#82b9dd';g.fillRect(0,0,W,y);g.fillStyle='#6c8456';g.fillRect(0,H*.45,W,H*.13);g.fillStyle='#303236';g.fillRect(0,y,W,H-y);g.fillStyle='#eee';g.fillRect(0,y+8,W,4);let s=scroll%190;g.fillStyle='#f6e59c';for(let i=-1;i<8;i++)g.fillRect(i*190-s,H*.82,110,8);
let fast=Math.max(0,(speed-30)/80);g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;for(let i=0;i<18;i++){let yy=y+25+(i*31+scroll*2.4)%(H-y);g.beginPath();g.moveTo(0,yy);g.lineTo(Math.min(W,60+fast*170),yy);g.stroke()}

 // frame
 g.strokeStyle=r.c;g.lineWidth=8;g.beginPath();g.moveTo(-8,6);g.lineTo(-30,-30);g.lineTo(27,-25);g.lineTo(-8,6);g.stroke();

let exhaustPuffs=[];
function emitExhaust(cx,cy,r){
 if(!(gas||speed>8))return;
 let count=gas?2:1;
 for(let i=0;i<count;i++) exhaustPuffs.push({
   x:cx-75,y:cy+5+(Math.random()-.5)*4,
   vx:-1.4-Math.random()*2.2-speed*.012,vy:(Math.random()-.5)*.35,
   life:1,size:3+Math.random()*4
 });
 if(exhaustPuffs.length>90)exhaustPuffs.splice(0,exhaustPuffs.length-90);
}
function drawExhaust(){
 for(let i=exhaustPuffs.length-1;i>=0;i--){
   let p=exhaustPuffs[i];p.x+=p.vx;p.y+=p.vy;p.life-=.025;p.size+=.10;
   if(p.life<=0){exhaustPuffs.splice(i,1);continue}
   g.globalAlpha=Math.max(0,p.life)*.34;
   g.fillStyle=gas?'#b9bec4':'#d8d8d8';
   g.beginPath();g.arc(p.x,p.y,p.size,0,Math.PI*2);g.fill();
 }
 g.globalAlpha=1;
}
function sportBike(cx,cy,r){
 let sp=scroll*.055, rearY=24+suspR*.55, frontY=24+suspF*.55;
 g.save();g.translate(cx,cy);g.rotate(-angle+chassisPitch);
 wheelPic(-60,rearY,28,sp);wheelPic(62,frontY,28,sp);
 // swingarm and inverted fork
 g.strokeStyle='#9aa0a6';g.lineWidth=7;g.beginPath();g.moveTo(-60,rearY);g.lineTo(-10,8);g.stroke();
 g.strokeStyle='#d9b84c';g.lineWidth=7;g.beginPath();g.moveTo(33,-25);g.lineTo(62,frontY);g.stroke();
 // compact aluminum frame
 g.strokeStyle='#b7bcc2';g.lineWidth=6;g.beginPath();g.moveTo(-12,8);g.lineTo(-28,-27);g.lineTo(27,-24);g.lineTo(-12,8);g.stroke();
 // engine
 g.fillStyle='#25282c';g.roundRect(-25,-8,47,35,7);g.fill();
 g.fillStyle='#555b61';g.roundRect(-17,-2,29,23,5);g.fill();
 // exhaust can
 g.strokeStyle='#888';g.lineWidth=6;g.beginPath();g.moveTo(17,17);g.quadraticCurveTo(-12,29,-48,8);g.stroke();
 g.fillStyle='#777';g.roundRect(-69,1,31,10,5);g.fill();
 // aerodynamic lower fairing
 g.fillStyle=r.c;g.beginPath();g.moveTo(-35,-29);g.lineTo(20,-34);g.lineTo(52,-18);g.lineTo(31,13);g.lineTo(-28,18);g.lineTo(-48,1);g.closePath();g.fill();
 // dark vent
 g.fillStyle='#17191d';g.beginPath();g.moveTo(-4,-20);g.lineTo(27,-23);g.lineTo(35,-13);g.lineTo(7,-8);g.closePath();g.fill();
 // tank and tail
 g.fillStyle=r.c;g.beginPath();g.moveTo(-31,-34);g.quadraticCurveTo(-12,-54,18,-42);g.lineTo(29,-27);g.lineTo(-29,-25);g.fill();
 g.beginPath();g.moveTo(-31,-34);g.lineTo(-72,-46);g.lineTo(-78,-37);g.lineTo(-43,-25);g.fill();
 g.fillStyle='#111';g.roundRect(-52,-46,50,8,4);g.fill();
 // nose fairing + windscreen
 g.fillStyle=r.c;g.beginPath();g.moveTo(18,-42);g.quadraticCurveTo(51,-53,76,-29);g.lineTo(67,-14);g.lineTo(34,-22);g.closePath();g.fill();
 g.fillStyle='#6f8795aa';g.beginPath();g.moveTo(35,-49);g.quadraticCurveTo(51,-64,62,-42);g.lineTo(49,-39);g.closePath();g.fill();
 // clip-ons
 g.strokeStyle='#333';g.lineWidth=4;g.beginPath();g.moveTo(34,-43);g.lineTo(49,-48);g.stroke();
 // tucked rider
 g.fillStyle='#20242a';g.beginPath();g.arc(-5,-63,12,0,Math.PI*2);g.fill();
 g.strokeStyle='#20242a';g.lineWidth=12;g.beginPath();g.moveTo(-9,-52);g.lineTo(18,-40);g.lineTo(40,-43);g.stroke();
 g.lineWidth=10;g.beginPath();g.moveTo(-12,-48);g.lineTo(-37,-30);g.lineTo(-22,-6);g.stroke();

function quad(cx,cy,r){let sp=scroll*.045;g.save();g.translate(cx,cy);g.rotate(-angle);wheelPic(-61,22,27,sp);wheelPic(61,22,27,sp);g.fillStyle='#171717';g.fillRect(-70,12,140,8);g.fillStyle=r.c;g.beginPath();g.moveTo(-65,-12);g.lineTo(-40,-29);g.lineTo(30,-29);g.lineTo(66,-10);g.lineTo(54,9);g.lineTo(-58,9);g.closePath();g.fill();g.fillStyle='#292929';g.roundRect(-24,-20,45,30,5);g.fill();g.fillStyle=r.c;g.fillRect(-72,-19,28,8);g.fillRect(43,-19,30,8);g.strokeStyle='#aaa';g.lineWidth=5;g.beginPath();g.moveTo(-61,22);g.lineTo(-28,1);g.moveTo(61,22);g.lineTo(29,1);g.stroke();g.strokeStyle='#333';g.lineWidth=5;g.beginPath();g.moveTo(20,-27);g.lineTo(34,-51);g.lineTo(51,-52);g.stroke();g.fillStyle='#222';g.beginPath();g.arc(2,-70,11,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=9;g.beginPath();g.moveTo(1,-59);g.lineTo(-8,-34);g.moveTo(-2,-54);g.lineTo(30,-45);g.lineTo(45,-51);g.stroke();g.restore()}
function ebike(cx,cy,r){let sp=scroll*.045;g.save();g.translate(cx,cy);g.rotate(-angle);wheelPic(-52,22,24,sp);wheelPic(52,22,24,sp);g.strokeStyle=r.c;g.lineWidth=7;g.beginPath();g.moveTo(-52,22);g.lineTo(-7,-20);g.lineTo(52,22);g.lineTo(2,22);g.lineTo(-52,22);g.stroke();g.fillStyle='#222';g.roundRect(-14,-17,23,37,4);g.fill();rider();g.restore()}
function loop(t){let dt=Math.min(.03,(t-last)/1000);last=t,r=R();if((r.t==='DIRT BIKE'||r.t==='SPORT BIKE')&&started)temp=Math.min(110,temp+dt*((choke?8:3)+(gas?3:0)));let can=(r.t!=='DIRT BIKE'&&r.t!=='SPORT BIKE')||started,acc=0;if(can){if((r.t==='DIRT BIKE'||r.t==='SPORT BIKE')){let caps=[0,30,50,72,92,108,r.max];if(gear){let cap=caps[gear];acc=gas*(gear<3?58:gear<5?45:38);if(speed>cap)acc-=45;rpm=Math.min(10000,1200+(speed/cap)*7800+(gas?700:0))}else{rpm=1000+(gas?4200:0)}}else acc=gas?(r.t==='TUNED QUAD'?58:46):0;speed+=(acc-(brake?70:4))*dt;speed=Math.max(0,Math.min(r.max,speed));let target=wheel&&speed>8?Math.min(1.02,.18+speed/130):0;angle+=(target-angle)*4.5*dt;dist+=speed*dt/3.6}else speed=Math.max(0,speed-20*dt);// V13 stable tunable suspension.
let sn=stiffness/100,dn=damping/100;
let travel=9-sn*5;
let targetF=(brake?travel*.9:0)-(gas&&gear?travel*.12:0);
let targetR=(gas&&gear?travel*.65:0)-(brake?travel*.10:0);
if(wheel&&speed>8){targetF=-travel*.65;targetR=travel*.75}
let response=Math.max(1.2,9-sn*3.2-dn*4.4);
let ease=1-Math.exp(-response*Math.min(dt,.03));
suspF+=(targetF-suspF)*ease;
suspR+=(targetR-suspR)*ease;
suspF=Math.max(-9,Math.min(9,suspF));
suspR=Math.max(-9,Math.min(9,suspR));
// Chassis weight transfer: braking pitches nose down; acceleration pitches nose up.
// Stiffness reduces pitch amount. Damping slows how quickly the chassis settles.
let pitchTravel=(1-sn*.55);
let targetPitch=0;
if(brake&&speed>3) targetPitch=.105*pitchTravel;
else if(gas&&gear&&speed>1) targetPitch=-.072*pitchTravel;
if(wheel&&speed>8) targetPitch=0; // wheelie angle already handles intentional lift
let pitchResponse=Math.max(1.0,7.5-sn*2.0-dn*4.2);
let pitchEase=1-Math.exp(-pitchResponse*Math.min(dt,.03));

chassisPitch=Math.max(-.09,Math.min(.12,chassisPitch));

scroll+=speed*dt*9.5;engine();road();let bx=W*.42,by=H*.58-31;r.t==='DIRT BIKE'?dirt(bx,by,r):r.t==='SPORT BIKE'?sportBike(bx,by,r):r.t==='TUNED QUAD'?quad(bx,by,r):ebike(bx,by,r);document.querySelector('#stats').innerHTML=`${r.n}<br>${speed.toFixed(0)} MPH • ${Math.round(rpm)} RPM`;document.querySelector('#status').textContent=(r.t==='DIRT BIKE'||r.t==='SPORT BIKE')?(started?(gear?`⚙️ GEAR ${gear}`:'🟢 NEUTRAL'):'⚫ ENGINE OFF'):(r.t==='TUNED QUAD'?`💨 BOOST ${Math.round(turbo*100)}%`:'⚡ ELECTRIC');update();drawExhaust();requestAnimationFrame(loop)}requestAnimationFrame(loop);

const susPanel=document.querySelector('#susPanel');
